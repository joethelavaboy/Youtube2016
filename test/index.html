  <!-- Dynamic Authentication Engine -->
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      var isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

      if (isLoggedIn) {
        var userEmail = localStorage.getItem('userEmail') || 'user@youtube.com';
        var userPfp = localStorage.getItem('youtubePfp') || 'https://s.ytimg.com/yts/img/pixel-vfl3z5WfW.gif';

        // 1. Hide the Sidebar Promo Card
        var promoBox = document.getElementById('signupPromoBox');
        if (promoBox) {
          promoBox.style.display = 'none';
        }

        // 2. Render Avatar & Account Controls in Masthead
        var signinContainer = document.getElementById('signinContainer');
        if (signinContainer) {
          signinContainer.style.display = 'flex';
          signinContainer.style.alignItems = 'center';
          signinContainer.style.gap = '12px';

          signinContainer.innerHTML = `
            <div style="position: relative; display: inline-block;">
              <button id="userPfpBtn" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;">
                <img src="${userPfp}" alt="User Avatar" style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ccc; background-color: #0073e6;">
              </button>
            </div>
            <a href="#" id="customSignOutBtn" style="color: #666; font-size: 11px; text-decoration: none; font-weight: bold;">Sign out</a>
          `;

          // 3. Attach Sign-Out Listener
          document.getElementById('customSignOutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.reload();
          });
        }
      }
    });
  </script>
